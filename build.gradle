// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        kotlin_version = '2.1.0'

        appcompat_version = '1.7.0'
        core_ktx_version = '1.15.0'
        core_testing_version = '2.2.0'
        constraintlayout_version = '2.2.0'
        material_version = "1.12.0"
        retrofit_version = '2.11.0'
        okhttp_version = '4.12.0'
        glide_version = '4.16.0'
        circleimageview_version = '3.1.0'

        junit_version = '4.13.2'
        mockk_version = '1.13.4'

        test_runner_version = '1.6.2'
        espresso_version = '3.6.1'

        koin_version = "4.0.1"
        lifecycle_version = "2.7.8"
        coroutines_version = "1.3.3"
        rxjava_version = "2.2.17"
        rxandroid_version = "2.1.1"
        core_ktx_test_version = "1.2.0"
    }

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
